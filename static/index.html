<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Transit Gateway</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #131b2e;
      --bg-card-hover: #18223a;
      --bg-input: #0f1626;
      --bg-sidebar: #0e1526;
      --border: #23304d;
      --border-focus: #3b82f6;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius: 8px;
      --sidebar-w: 260px;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      overflow: hidden;
    }

    /* ── 顶栏 ── */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border);
      height: 56px;
    }
    .nav-brand { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; color: #fff; }
    .nav-brand svg { width: 18px; height: 18px; }
    .nav-status { display: flex; align-items: center; gap: 14px; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 9999px; font-size: 12px; font-weight: 500;
    }
    .badge-online { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
    .badge-offline { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

    /* ── 主体：左右分栏 ── */
    .layout { display: flex; height: calc(100vh - 56px); }

    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-section-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
      color: var(--text-dim); padding: 14px 18px 6px;
    }
    .sidebar-list { flex: 1; overflow-y: auto; padding: 0 8px; }
    .sidebar-footer { padding: 10px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }

    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 10px; border-radius: 6px; cursor: pointer;
      font-size: 13px; color: var(--text-muted);
      transition: background 0.12s, color 0.12s;
      margin-bottom: 2px;
    }
    .nav-item:hover { background: var(--bg-card-hover); color: var(--text-main); }
    .nav-item.active { background: var(--primary); color: #fff; }
    .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
    .nav-item .ni-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ni-copy { display: flex; flex: 1; min-width: 0; flex-direction: column; }
    .ni-name-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .ni-name-row .ni-name { min-width: 0; }
    .ni-badge {
      padding: 1px 5px; border: 1px solid var(--border); border-radius: 4px;
      color: var(--text-dim); font-size: 9px; line-height: 1.4; white-space: nowrap;
    }
    .nav-item.active .ni-badge { border-color: rgba(255,255,255,0.3); color: rgba(255,255,255,0.78); }
    .ni-meta { overflow: hidden; color: var(--text-dim); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .nav-item.active .ni-meta { color: rgba(255,255,255,0.68); }
    .provider-group-label {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 10px 5px; color: var(--text-dim); font-size: 10px; font-weight: 600;
      letter-spacing: 0.4px; text-transform: uppercase;
    }
    .provider-group-label span:last-child { font-family: var(--font-mono); }
    .nav-item.grouped { margin-left: 6px; }
    .ni-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .ni-dot.on { background: var(--success); }
    .ni-dot.off { background: #475569; }
    .ni-count { font-size: 11px; color: var(--text-dim); font-family: var(--font-mono); }
    .nav-item.active .ni-count { color: rgba(255,255,255,0.7); }

    /* ── 右侧详情 ── */
    .content { flex: 1; overflow-y: auto; padding: 24px 32px; }
    .content-inner { max-width: 820px; margin: 0 auto; }

    .detail-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border);
    }
    .detail-actions { display: flex; align-items: center; gap: 10px; }
    .detail-title-group { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .detail-title { font-size: 20px; font-weight: 600; color: #fff; }
    .detail-tag {
      font-size: 11px; padding: 2px 8px; background: #1e293b; color: #94a3b8;
      border-radius: 4px; border: 1px solid var(--border); text-transform: uppercase;
    }

    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 8px 15px; border-radius: var(--radius);
      font-size: 13px; font-weight: 500; cursor: pointer;
      border: 1px solid transparent; transition: all 0.15s ease; white-space: nowrap;
    }
    .btn svg { width: 15px; height: 15px; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #1e293b; color: #f8fafc; border-color: var(--border); }
    .btn-secondary:hover { background: #334155; }
    .btn-danger-ghost { background: transparent; color: #fca5a5; border-color: rgba(239,68,68,0.35); }
    .btn-danger-ghost:hover { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.6); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: #dc2626; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background: #334155; transition: .2s; border-radius: 22px; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background: #fff; transition: .2s; border-radius: 50%; }
    input:checked + .slider { background: var(--primary); }
    input:checked + .slider:before { transform: translateX(18px); }
    .switch input:focus-visible + .slider { outline: 2px solid #60a5fa; outline-offset: 3px; }
    .provider-state { display: inline-flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 11px; }
    .provider-state::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #475569; }
    .provider-state.enabled { color: #6ee7b7; }
    .provider-state.enabled::before { background: var(--success); }

    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
    .form-label { font-size: 12px; font-weight: 500; color: var(--text-muted); }
    .input-text, .input-textarea, select.input-text {
      width: 100%; background: var(--bg-input); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 9px 12px; font-size: 13px;
      color: var(--text-main); outline: none; font-family: inherit; transition: border-color 0.15s;
    }
    .input-textarea { font-family: var(--font-mono); font-size: 12px; min-height: 68px; resize: vertical; }
    .input-text:focus, .input-textarea:focus { border-color: var(--border-focus); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    .credential-import-card {
      display: flex; align-items: center; gap: 16px; margin-bottom: 18px; padding: 14px 16px;
      background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius);
    }
    .credential-import-copy { display: flex; align-items: flex-start; gap: 10px; min-width: 0; flex: 1; }
    .credential-import-copy > svg { width: 20px; height: 20px; margin-top: 1px; color: #93c5fd; flex-shrink: 0; }
    .credential-import-title { color: var(--text-main); font-size: 13px; font-weight: 600; }
    .credential-import-help { margin-top: 2px; color: var(--text-dim); font-size: 11px; line-height: 1.5; }
    .credential-import-card .btn { min-height: 44px; flex-shrink: 0; }
    .credential-file-input { display: none; }

    .source-status-list { display: flex; flex-wrap: wrap; gap: 8px; margin: -4px 0 18px; }
    .source-status {
      display: inline-flex; align-items: center; gap: 7px; padding: 7px 10px;
      border: 1px solid var(--border); border-radius: 999px; background: var(--bg-input);
      color: var(--text-muted); font-size: 11px;
    }
    .source-status svg { width: 14px; height: 14px; }
    .source-status.ok svg { color: var(--success); }
    .source-status.error svg { color: var(--danger); }
    .source-status-note { width: 100%; color: var(--text-dim); font-size: 11px; line-height: 1.5; }

    .route-conflicts {
      margin-bottom: 18px; padding: 14px 16px; border: 1px solid rgba(245,158,11,0.35);
      border-radius: var(--radius); background: rgba(245,158,11,0.07);
    }
    .route-conflicts-head { display: flex; align-items: center; gap: 8px; color: #fbbf24; font-size: 13px; font-weight: 600; }
    .route-conflicts-head svg { width: 16px; height: 16px; }
    .route-conflicts-help { margin: 5px 0 10px 24px; color: var(--text-muted); font-size: 11px; line-height: 1.5; }
    .route-conflict-row { display: grid; grid-template-columns: minmax(0, 1fr) 220px; align-items: center; gap: 12px; padding: 7px 0; }
    .route-conflict-row code { overflow: hidden; color: #cbd5e1; font-family: var(--font-mono); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }

    .provider-catalog-modal { width: 760px; }
    .provider-catalog-modal .modal-body { padding-top: 18px; }
    .provider-catalog-section + .provider-catalog-section { margin-top: 22px; }
    .provider-catalog-heading { margin-bottom: 9px; }
    .provider-catalog-heading strong { display: block; color: var(--text-main); font-size: 12px; font-weight: 600; }
    .provider-catalog-heading span { display: block; margin-top: 2px; color: var(--text-dim); font-size: 11px; }
    .provider-catalog-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .provider-type-card {
      min-height: 96px; padding: 14px; display: flex; align-items: flex-start; gap: 12px;
      border: 1px solid var(--border); border-radius: 10px; background: var(--bg-input);
      color: inherit; cursor: pointer; text-align: left; transition: border-color 0.15s, background 0.15s;
    }
    .provider-type-card.wide { grid-column: 1 / -1; }
    .provider-type-card:hover { border-color: var(--border-focus); background: var(--bg-card-hover); }
    .provider-type-copy { display: block; min-width: 0; flex: 1; }
    .provider-type-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .provider-type-icon {
      width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border); border-radius: 9px; background: #1e293b; color: #93c5fd; flex-shrink: 0;
    }
    .provider-type-icon svg { width: 20px; height: 20px; }
    .provider-type-name { display: block; color: var(--text-main); font-size: 14px; font-weight: 600; }
    .provider-type-status { color: #93c5fd; font-size: 10px; white-space: nowrap; }
    .provider-type-desc { display: block; margin-top: 4px; color: var(--text-dim); font-size: 11px; line-height: 1.5; }
    .vertex-credential-summary {
      min-height: 54px; margin-top: 10px; padding: 10px 12px; border: 1px dashed var(--border);
      border-radius: var(--radius); color: var(--text-dim); font-size: 11px; line-height: 1.6;
    }
    .vertex-credential-summary.ready { border-style: solid; border-color: rgba(16,185,129,0.35); color: var(--text-muted); }
    .vertex-credential-summary strong { color: var(--text-main); font-weight: 600; }

    /* 敏感字段：右侧眼睛按钮 + 默认掩码 */
    .secret-wrap { position: relative; }
    .secret-wrap .input-text, .secret-wrap .input-textarea { padding-right: 40px; }
    .secret.secret-hidden { -webkit-text-security: disc; text-security: disc; }
    .eye-btn {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: transparent; border: none; color: var(--text-dim); cursor: pointer; padding: 4px; line-height: 0;
    }
    .secret-wrap.is-textarea .eye-btn { top: 10px; transform: none; }
    .eye-btn:hover { color: var(--text-main); }
    .eye-btn svg { width: 16px; height: 16px; }

    .models-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .model-search { margin-bottom: 8px; }
    .models-box {
      background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 8px 10px; max-height: 420px; overflow-y: auto; display: block;
    }
    .model-group { margin-bottom: 4px; }
    .model-group-head {
      display: flex; align-items: center; gap: 8px; padding: 6px 4px; cursor: pointer;
      font-size: 12px; color: var(--text-muted); position: sticky; top: -8px; background: var(--bg-input); z-index: 1;
    }
    .model-group-head:hover { color: var(--text-main); }
    .mg-caret { font-size: 10px; transition: transform .15s; display: inline-block; }
    .model-group.collapsed .mg-caret { transform: rotate(-90deg); }
    .model-group.collapsed .model-group-items { display: none; }
    .mg-name { font-weight: 600; text-transform: capitalize; }
    .mg-count { color: var(--text-dim); font-family: var(--font-mono); }
    .mg-selectall { margin-left: auto; font-size: 11px; color: var(--primary); }
    .mg-selectall:hover { text-decoration: underline; }
    .model-group-items { display: flex; flex-direction: column; gap: 1px; padding: 2px 0 4px 6px; }
    .model-item {
      display: flex; align-items: center; gap: 8px; font-size: 12px;
      font-family: var(--font-mono); color: #cbd5e1; cursor: pointer; user-select: none;
      padding: 3px 4px; border-radius: 4px;
    }
    .model-item:hover { background: var(--bg-card-hover); }
    .model-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .api-overview {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      margin-bottom: 16px; padding: 13px 15px; border: 1px solid var(--border);
      border-radius: var(--radius); background: var(--bg-input);
    }
    .api-overview-copy { min-width: 0; }
    .api-overview-title { color: var(--text-main); font-size: 12px; font-weight: 600; }
    .api-overview code { color: #93c5fd; font-family: var(--font-mono); font-size: 12px; }
    .api-overview-help { margin-top: 3px; color: var(--text-dim); font-size: 11px; }
    .api-endpoint-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .api-endpoint-card {
      position: relative; min-height: 92px;
      border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-input);
      color: inherit; transition: border-color .15s, background .15s;
    }
    .api-endpoint-card:hover, .api-endpoint-card:focus-within { border-color: #475569; background: var(--bg-card-hover); }
    .api-endpoint-card.active { border-color: var(--border-focus); background: rgba(59,130,246,.08); }
    .api-endpoint-select {
      width: 100%; min-height: 90px; padding: 13px 82px 13px 14px;
      display: flex; flex-direction: column; gap: 7px;
      border: 0; border-radius: inherit; background: transparent; color: inherit;
      cursor: pointer; text-align: left;
    }
    .api-endpoint-copy {
      position: absolute; top: 8px; right: 8px; min-height: 44px; padding: 7px 9px;
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      border: 1px solid var(--border); border-radius: 6px; background: var(--bg-card);
      color: var(--text-muted); cursor: pointer; font-size: 11px;
    }
    .api-endpoint-copy:hover { border-color: var(--border-focus); color: var(--text-main); }
    .api-endpoint-copy svg { width: 14px; height: 14px; }
    .api-endpoint-head { display: flex; align-items: center; gap: 8px; }
    .api-method {
      min-width: 42px; padding: 2px 6px; border-radius: 4px; font-family: var(--font-mono);
      font-size: 10px; font-weight: 700; text-align: center;
    }
    .api-method.get { background: rgba(16,185,129,.14); color: #6ee7b7; }
    .api-method.post { background: rgba(59,130,246,.16); color: #93c5fd; }
    .api-path { overflow: hidden; color: var(--text-main); font-family: var(--font-mono); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .api-endpoint-desc { color: var(--text-dim); font-size: 11px; line-height: 1.5; }
    .api-tester {
      padding: 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-card);
    }
    .api-tester-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .api-tester-title { color: var(--text-main); font-size: 13px; font-weight: 600; }
    .api-tester-endpoint { color: #93c5fd; font-family: var(--font-mono); font-size: 11px; }
    .test-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .test-result {
      margin-top: 14px; padding: 14px; background: var(--bg-input); border: 1px solid var(--border);
      border-radius: var(--radius); font-family: var(--font-mono); font-size: 12px;
      color: #cbd5e1; min-height: 88px; max-height: 440px; overflow: auto;
      white-space: pre-wrap; word-break: break-word;
    }

    .logs-box {
      background: #070a12; border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; font-family: var(--font-mono); font-size: 12px; color: #94a3b8;
      height: calc(100vh - 220px); overflow-y: auto;
    }
    .log-line { margin-bottom: 4px; line-height: 1.4; }
    .log-err { color: #f87171; } .log-warn { color: #fbbf24; } .log-info { color: #38bdf8; }

    .empty-hint { color: var(--text-dim); font-size: 13px; padding: 40px; text-align: center; }
    .empty-models { color: var(--text-dim); font-size: 13px; padding: 32px; text-align: center; }

    /* 已选模型列表（主面板，单列） */
    .selected-list {
      background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 6px; min-height: 72px; max-height: 480px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 2px;
    }
    .selected-item {
      display: flex; align-items: center; gap: 10px; font-family: var(--font-mono);
      font-size: 13px; color: #cbd5e1; padding: 8px 10px; border-radius: 5px;
    }
    .selected-item:hover { background: var(--bg-card-hover); }
    .si-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .si-remove { width: 15px; height: 15px; cursor: pointer; color: var(--text-dim); flex-shrink: 0; }
    .si-remove:hover { color: var(--danger); }

    /* 模型选择弹窗 */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center; z-index: 200;
    }
    .modal {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      width: 660px; max-width: 92vw; max-height: 82vh; display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .modal-title { font-size: 16px; font-weight: 600; color: #fff; }
    .modal-subtitle { margin-top: 3px; font-size: 12px; color: var(--text-muted); }
    .modal-close-btn {
      width: 44px; height: 44px; margin: -10px -12px -10px 0; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border: 0; border-radius: 6px; background: transparent; color: var(--text-muted); cursor: pointer;
    }
    .modal-close-btn:hover { color: #fff; background: var(--bg-card-hover); }
    .modal-close-btn svg { width: 18px; height: 18px; }
    .modal-body { padding: 16px 20px; overflow-y: auto; flex: 1; }
    .modal-foot { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }

    .provider-modal { width: 580px; }
    .provider-modal .modal-body { padding-top: 20px; }
    .provider-modal .input-text, .provider-modal .input-textarea { min-height: 44px; }
    .provider-modal .modal-foot .btn { min-height: 44px; }
    .provider-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field-required { color: #fca5a5; margin-left: 3px; }
    .field-hint { font-size: 11px; line-height: 1.5; color: var(--text-dim); }
    .field-error { min-height: 17px; font-size: 11px; line-height: 1.5; color: #fca5a5; }
    .input-invalid { border-color: var(--danger) !important; }
    .provider-preview {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 12px; margin-bottom: 18px; border: 1px solid var(--border);
      border-radius: var(--radius); background: var(--bg-input); color: var(--text-muted); font-size: 12px;
    }
    .provider-preview code { color: #93c5fd; font-family: var(--font-mono); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; width: 100%; }
    .btn:focus-visible, .modal-close-btn:focus-visible, .provider-type-card:focus-visible,
    .input-text:focus-visible, .input-textarea:focus-visible,
    .api-endpoint-select:focus-visible, .api-endpoint-copy:focus-visible {
      outline: 2px solid #60a5fa; outline-offset: 2px;
    }

    @media (max-width: 560px) {
      .provider-form-grid { grid-template-columns: 1fr; gap: 0; }
      .provider-catalog-grid { grid-template-columns: 1fr; }
      .api-endpoint-grid { grid-template-columns: 1fr; }
      .api-overview, .api-tester-head { align-items: flex-start; flex-direction: column; }
      .modal { max-width: calc(100vw - 24px); max-height: calc(100vh - 24px); }
      .modal-head, .modal-body, .modal-foot { padding-left: 16px; padding-right: 16px; }
      .credential-import-card { align-items: stretch; flex-direction: column; }
      .credential-import-card .btn { justify-content: center; }
      .route-conflict-row { grid-template-columns: 1fr; gap: 6px; }
    }

    .toast {
      position: fixed; bottom: 24px; right: 24px; background: #1e293b; border: 1px solid var(--border);
      color: #fff; padding: 12px 20px; border-radius: var(--radius); font-size: 13px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px;
      z-index: 100; opacity: 0; transform: translateY(10px); transition: all 0.2s ease; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="nav-brand">
      <i data-lucide="shuffle"></i>
      <span>LLM Transit Gateway</span>
    </div>
    <div class="nav-status">
      <div id="statusBadge" class="badge badge-offline">
        <span class="dot"></span>
        <span id="statusText">检测服务中...</span>
      </div>
      <button class="btn btn-secondary btn-sm" onclick="restartService()" id="btnRestart">
        <i data-lucide="rotate-cw"></i><span>重启网关</span>
      </button>
      <button class="btn btn-primary btn-sm" onclick="saveAndApply()">
        <i data-lucide="save"></i><span>保存并应用</span>
      </button>
    </div>
  </div>

  <div class="layout">
    <!-- 左侧导航 -->
    <div class="sidebar">
      <div class="sidebar-section-label">模型厂商</div>
      <div class="sidebar-list" id="providerNav"></div>
      <div class="sidebar-footer">
        <button class="btn btn-secondary btn-sm" onclick="addCustomProvider()" style="justify-content:center;">
          <i data-lucide="plus"></i><span>添加网关</span>
        </button>
        <div class="nav-item" id="navSettings" onclick="selectView('settings')" style="margin:0 0 8px;">
          <i data-lucide="sliders-horizontal"></i><span class="ni-name">全局设置</span>
        </div>
        <div style="display:flex; gap:8px;">
          <div class="nav-item" id="navTest" onclick="selectView('test')" style="flex:1; margin:0;">
            <i data-lucide="code-2"></i><span class="ni-name">API 接口</span>
          </div>
          <div class="nav-item" id="navLogs" onclick="selectView('logs')" style="flex:1; margin:0;">
            <i data-lucide="scroll-text"></i><span class="ni-name">实时日志</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 右侧详情 -->
    <div class="content">
      <div class="content-inner" id="detailPanel">
        <div class="empty-hint">加载配置中...</div>
      </div>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    let currentConfig = null;
    let activeView = 0;   // 数字=provider索引；'test' / 'logs'
    let logInited = false;
    let pendingVertexCredentials = null;
    let vertexDraftNameEdited = false;
    let vertexDraftIdEdited = false;
    let activeApiEndpoint = 'models';
    const API_ENDPOINTS = {
      health: {
        method: 'GET', path: '/api/health', name: '服务状态', auth: false,
        description: '检查网关与 LiteLLM 核心是否就绪。'
      },
      models: {
        method: 'GET', path: '/v1/models', name: '模型列表', auth: true,
        description: '获取所有已启用的对外模型；兼容别名为 /models。'
      },
      chat: {
        method: 'POST', path: '/v1/chat/completions', name: 'Chat Completions', auth: true,
        description: '使用 OpenAI Chat Completions 格式发起对话。'
      },
      responses: {
        method: 'POST', path: '/v1/responses', name: 'Responses', auth: true,
        description: '使用 OpenAI Responses 格式发起请求。'
      },
    };

    function showToast(msg, type='info') {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.borderColor = type === 'error' ? '#ef4444' : (type === 'success' ? '#10b981' : '#3b82f6');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[ch]);
    }

    async function checkHealth() {
      const badge = document.getElementById('statusBadge');
      const text = document.getElementById('statusText');
      try {
        const res = await fetch('/api/health');
        const data = await res.json();
        if (data.status === 'ok') {
          badge.className = 'badge badge-online';
          text.textContent = `LiteLLM 正常 (${data.active_models_count} 个模型激活)`;
        } else {
          badge.className = 'badge badge-offline';
          text.textContent = 'LiteLLM 未就绪';
        }
      } catch (e) {
        badge.className = 'badge badge-offline';
        text.textContent = '服务离线';
      }
    }

    async function loadProviders() {
      try {
        const res = await fetch('/api/config');
        currentConfig = await res.json();
        restoreActive();
        renderSidebar();
        renderDetail();
        lucide.createIcons();
      } catch (e) {
        showToast('加载配置失败: ' + e.message, 'error');
      }
    }

    // ── 左侧导航 ──
    function isCustomProvider(provider) {
      if (provider?.extra?.template_id === 'custom_openai') return true;
      return provider?.type === 'openai_compatible' && provider.id !== 'deepseek';
    }

    function providerFamilyKey(provider) {
      if (provider.type === 'vertex_ai') return 'vertex_ai';
      if (provider.extra?.template_id && provider.extra.template_id !== 'custom_openai') {
        return provider.extra.template_id;
      }
      // 自定义兼容接口代表不同品牌，不能因为底层协议相同就合并到一组。
      if (isCustomProvider(provider)) return `custom:${provider.id}`;
      return provider.id;
    }

    function providerFamilyLabel(provider) {
      return ({
        vertex_ai: 'Google Vertex AI', gemini: 'Google Gemini API', bedrock: 'AWS Bedrock',
        openai: 'OpenAI', anthropic: 'Anthropic', deepseek: 'DeepSeek'
      })[providerFamilyKey(provider)] || provider.name;
    }

    function providerKindLabel(provider) {
      if (isCustomProvider(provider)) return '自定义接口';
      return ({
        vertex_ai: 'Vertex AI', gemini: 'Gemini API', bedrock: 'AWS Bedrock',
        openai: 'OpenAI API', anthropic: 'Anthropic API', openai_compatible: 'DeepSeek API'
      })[provider.type] || provider.type;
    }

    function renderSidebar() {
      const nav = document.getElementById('providerNav');
      nav.innerHTML = '';
      const grouped = new Map();
      (currentConfig?.providers || []).forEach((p, idx) => {
        const family = providerFamilyKey(p);
        if (!grouped.has(family)) grouped.set(family, []);
        grouped.get(family).push({ p, idx });
      });
      const groups = Array.from(grouped.entries())
        .map(([family, items]) => ({ family, items, enabled: items.some(({ p }) => p.enabled) }))
        .sort((a, b) => Number(b.enabled) - Number(a.enabled));

      groups.forEach(({ items }) => {
        items.sort((a, b) => Number(b.p.enabled) - Number(a.p.enabled));
        if (items.length > 1) {
          const label = document.createElement('div');
          label.className = 'provider-group-label';
          label.innerHTML = `<span>${escapeHtml(providerFamilyLabel(items[0].p))}</span><span>${items.length}</span>`;
          nav.appendChild(label);
        }
        items.forEach(({ p, idx }) => {
          const item = document.createElement('div');
          item.className = 'nav-item' + (items.length > 1 ? ' grouped' : '') + (activeView === idx ? ' active' : '');
          item.onclick = () => selectView(idx);
          const count = (p.selected_models ?? p.models ?? []).length;
          const project = p.type === 'vertex_ai' ? (p.extra?.project || '') : '';
          const custom = isCustomProvider(p);
          item.innerHTML = `
            <span class="ni-dot ${p.enabled ? 'on' : 'off'}"></span>
            <span class="ni-copy">
              <span class="ni-name-row">
                <span class="ni-name">${escapeHtml(p.name)}</span>
                ${custom ? '<span class="ni-badge">自定义</span>' : ''}
              </span>
              ${project ? `<span class="ni-meta">${escapeHtml(project)}</span>` : ''}
            </span>
            <span class="ni-count">${count}</span>
          `;
          nav.appendChild(item);
        });
      });
      document.getElementById('navTest').classList.toggle('active', activeView === 'test');
      document.getElementById('navLogs').classList.toggle('active', activeView === 'logs');
      document.getElementById('navSettings').classList.toggle('active', activeView === 'settings');
    }

    function selectView(view) {
      activeView = view;
      persistActive();
      renderSidebar();
      renderDetail();
      lucide.createIcons();
    }

    function persistActive() {
      let v = activeView;
      if (typeof activeView === 'number') {
        const p = currentConfig?.providers?.[activeView];
        v = p ? 'id:' + p.id : '';
      }
      try { localStorage.setItem('activeView', v); } catch (e) {}
    }

    function restoreActive() {
      let saved = '';
      try { saved = localStorage.getItem('activeView') || ''; } catch (e) {}
      if (saved === 'test' || saved === 'logs' || saved === 'settings') { activeView = saved; return; }
      if (saved.startsWith('id:')) {
        const i = (currentConfig?.providers || []).findIndex(p => p.id === saved.slice(3));
        activeView = i >= 0 ? i : 0;
        return;
      }
      activeView = 0;
    }

    function enabledModelOwners() {
      const owners = new Map();
      (currentConfig?.providers || []).forEach((provider, idx) => {
        if (!provider.enabled) return;
        (provider.selected_models ?? provider.models ?? []).forEach(model => {
          if (!owners.has(model)) owners.set(model, []);
          owners.get(model).push({ provider, idx });
        });
      });
      return owners;
    }

    function buildRouteConflictsHtml(idx) {
      const provider = currentConfig.providers[idx];
      if (!provider?.enabled) return '';
      const routes = currentConfig.server?.bare_model_routes || {};
      const selected = new Set(provider.selected_models ?? provider.models ?? []);
      const conflicts = Array.from(enabledModelOwners().entries())
        .filter(([model, owners]) => selected.has(model) && owners.length > 1)
        .sort(([a], [b]) => a.localeCompare(b));
      if (!conflicts.length) return '';

      const rows = conflicts.map(([model, owners]) => {
        const configured = routes[model] || '';
        const options = owners.map(({ provider: owner }) => `
          <option value="${escapeHtml(owner.id)}" ${configured === owner.id ? 'selected' : ''}>
            ${escapeHtml(owner.name)}（${escapeHtml(owner.id)}/）
          </option>`).join('');
        return `
          <div class="route-conflict-row">
            <code title="${escapeHtml(model)}">${escapeHtml(model)}</code>
            <select class="input-text" data-model="${escapeHtml(model)}"
              onchange="updateBareModelRoute(this.dataset.model, this.value)">
              <option value="">不提供裸模型名</option>
              ${options}
            </select>
          </div>`;
      }).join('');

      return `
        <div class="route-conflicts">
          <div class="route-conflicts-head"><i data-lucide="triangle-alert"></i><span>重名模型需要指定裸名路由</span></div>
          <div class="route-conflicts-help">带网关前缀的模型名始终可用；未指定默认实例时，不会注册容易错路由的裸模型名。</div>
          ${rows}
        </div>`;
    }

    function buildVertexSourceStatusHtml(provider) {
      const sources = provider.model_sources || [];
      if (!sources.length) return '';
      const badges = sources.map(source => {
        const ok = source.status === 'ok';
        const detail = ok ? `已发现 ${source.count || 0} 个` : `无法读取${source.error ? `：${source.error}` : ''}`;
        return `
          <span class="source-status ${ok ? 'ok' : 'error'}" title="${escapeHtml(detail)}">
            <i data-lucide="${ok ? 'circle-check' : 'circle-x'}"></i>
            <span>${escapeHtml(source.name || source.id)} · ${escapeHtml(detail)}</span>
          </span>`;
      }).join('');
      return `
        <div class="source-status-list">
          ${badges}
          <div class="source-status-note">这里显示的是 Model Garden 候选模型；实际调用权限请在保存后通过「API 接口」确认。</div>
        </div>`;
    }

    // ── 右侧详情 ──
    function renderDetail() {
      const panel = document.getElementById('detailPanel');
      if (activeView === 'test') { renderTestPanel(panel); return; }
      if (activeView === 'logs') { renderLogsPanel(panel); return; }
      if (activeView === 'settings') { renderSettingsPanel(panel); return; }

      const idx = activeView;
      const p = currentConfig?.providers?.[idx];
      if (!p) { panel.innerHTML = '<div class="empty-hint">请选择左侧厂商</div>'; return; }

      const keysText = escapeHtml((p.api_keys || []).join('\n'));
      const selectedSet = new Set(p.selected_models || p.models || []);

      let extraFieldsHtml = '';
      if (p.type === 'bedrock') {
        extraFieldsHtml = `
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">AWS Region</label>
                <input type="text" class="input-text" value="${escapeHtml(p.extra?.region || 'us-west-2')}" onchange="updateExtra(${idx}, 'region', this.value)" />
            </div>
            <div class="form-group">
              <label class="form-label">AWS Bearer Token（如配置则优先使用）</label>
              <div class="secret-wrap">
                <input type="text" class="input-text secret secret-hidden" value="${escapeHtml(p.extra?.bearer_token || '')}" placeholder="ABSK..." onchange="updateExtra(${idx}, 'bearer_token', this.value)" />
                <button type="button" class="eye-btn" onclick="toggleSecret(this)"><i data-lucide="eye-off"></i></button>
              </div>
            </div>
          </div>`;
      } else if (p.type === 'vertex_ai') {
        const hasCredentials = Boolean(p.extra?.project && p.extra?.client_email && p.extra?.private_key);
        extraFieldsHtml = `
          <div class="credential-import-card">
            <div class="credential-import-copy">
              <i data-lucide="file-json-2"></i>
              <div>
                <div class="credential-import-title">${hasCredentials ? '当前项目凭证已配置' : '从服务账号 JSON 导入'}</div>
                <div class="credential-import-help" id="vertexImportHelp_${idx}">
                  ${hasCredentials ? `项目 ${escapeHtml(p.extra.project)}；导入新文件会更换这个实例的凭证。` : '自动填写项目 ID、客户端邮箱和私钥；Location 仍需手动确认。文件只在浏览器中解析。'}
                </div>
              </div>
            </div>
            <input type="file" class="credential-file-input" id="vertexCredentialsFile_${idx}"
              accept=".json,application/json" aria-describedby="vertexImportHelp_${idx}"
              onchange="importVertexServiceAccount(${idx}, this)" />
            <button type="button" class="btn btn-secondary"
              onclick="document.getElementById('vertexCredentialsFile_${idx}').click()">
              <i data-lucide="upload"></i><span>${hasCredentials ? '更换凭证' : '导入 JSON'}</span>
            </button>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">项目 ID（project_id）</label>
              <input type="text" class="input-text" value="${escapeHtml(p.extra?.project || '')}" onchange="updateExtra(${idx}, 'project', this.value)" placeholder="your-gcp-project" />
            </div>
            <div class="form-group">
              <label class="form-label">地区 Location</label>
              <input type="text" class="input-text" value="${escapeHtml(p.extra?.location || 'us-central1')}" onchange="updateExtra(${idx}, 'location', this.value)" placeholder="us-central1 / global" />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">客户端邮箱（client_email）</label>
            <input type="text" class="input-text" value="${escapeHtml(p.extra?.client_email || '')}" onchange="updateExtra(${idx}, 'client_email', this.value)" placeholder="xxx@xxx.iam.gserviceaccount.com" />
          </div>
          <div class="form-group">
            <label class="form-label">私钥（private_key，粘贴 JSON 中的 private_key 字段值）</label>
            <div class="secret-wrap is-textarea">
              <textarea class="input-textarea secret secret-hidden" style="min-height:120px;" placeholder="-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----" onchange="updateExtra(${idx}, 'private_key', this.value)">${escapeHtml(p.extra?.private_key || '')}</textarea>
              <button type="button" class="eye-btn" onclick="toggleSecret(this)"><i data-lucide="eye-off"></i></button>
            </div>
          </div>`;
      }

      let baseUrlHtml = '';
      if (p.type === 'openai' || p.type === 'openai_compatible' || p.type === 'anthropic') {
        baseUrlHtml = `
          <div class="form-group">
            <label class="form-label">API Base URL</label>
            <input type="text" class="input-text" value="${escapeHtml(p.base_url || '')}" onchange="updateBaseUrl(${idx}, this.value)" placeholder="https://..." />
          </div>`;
      }

      const selCount = (p.selected_models || []).length;
      const vertexSourceStatusHtml = p.type === 'vertex_ai' ? buildVertexSourceStatusHtml(p) : '';
      const routeConflictsHtml = buildRouteConflictsHtml(idx);

      const apiKeysHtml = (p.type === 'vertex_ai') ? '' : `
        <div class="form-group">
          <label class="form-label">API Keys（支持多 Key 换行输入，自动轮询）</label>
          <div class="secret-wrap is-textarea">
            <textarea class="input-textarea secret secret-hidden" placeholder="每行一个 API Key..." onchange="updateKeys(${idx}, this.value)">${keysText}</textarea>
            <button type="button" class="eye-btn" onclick="toggleSecret(this)"><i data-lucide="eye-off"></i></button>
          </div>
        </div>`;

      panel.innerHTML = `
        <div class="detail-header">
          <div class="detail-title-group">
            <span class="detail-title">${escapeHtml(p.name)}</span>
            <span class="detail-tag" style="text-transform:none;">${escapeHtml(providerKindLabel(p))}</span>
            <span class="detail-tag" style="text-transform:none;" title="模型名前缀，客户端按「${escapeHtml(p.id)}/模型名」调用">${escapeHtml(p.id)}/</span>
          </div>
          <div class="detail-actions">
            <button type="button" class="btn btn-danger-ghost btn-sm" onclick="confirmDeleteProvider(${idx})"
              aria-label="删除网关 ${escapeHtml(p.name)}">
              <i data-lucide="trash-2"></i><span>删除</span>
            </button>
            <span class="provider-state ${p.enabled ? 'enabled' : ''}">${p.enabled ? '已启用' : '未启用'}</span>
            <label class="switch" title="${p.enabled ? '停用' : '启用'} ${escapeHtml(p.name)}">
              <input type="checkbox" aria-label="${p.enabled ? '停用' : '启用'} ${escapeHtml(p.name)}"
                ${p.enabled ? 'checked' : ''} onchange="toggleProvider(${idx}, this.checked)" />
              <span class="slider"></span>
            </label>
          </div>
        </div>

        ${baseUrlHtml}
        ${extraFieldsHtml}
        ${apiKeysHtml}
        ${vertexSourceStatusHtml}
        ${routeConflictsHtml}

        <div class="form-group">
          <div class="models-head">
            <label class="form-label" id="modelCount_${idx}">模型（已选 ${selCount} / 共 ${(p.models || []).length} 个）</label>
            <div style="display:flex; gap:8px;">
              <button class="btn btn-secondary btn-sm" onclick="fetchModelsForProvider(${idx})" id="fetchBtn_${idx}">
                <i data-lucide="refresh-cw"></i><span>拉取模型</span>
              </button>
              ${(p.models || []).length ? `<button class="btn btn-secondary btn-sm" onclick="openModelModal(${idx})"><i data-lucide="list-checks"></i><span>选择模型</span></button>` : ''}
              <button class="btn btn-secondary btn-sm" onclick="addCustomModel(${idx})">
                <i data-lucide="plus"></i><span>加模型</span>
              </button>
            </div>
          </div>
          <div class="selected-list" id="selectedList_${idx}"></div>
        </div>
      `;
      renderSelectedList(idx);
    }

    // 主面板：单列展示已勾选模型（按名排序），可逐个移除
    function renderSelectedList(idx) {
      const el = document.getElementById(`selectedList_${idx}`);
      if (!el) return;
      const p = currentConfig.providers[idx];
      const sel = (p.selected_models || []).slice().sort();
      if (!sel.length) {
        el.innerHTML = `<div class="empty-models">暂无已选模型 —— 点击「拉取模型」或「选择模型」挑选</div>`;
        return;
      }
      const pid = p.id;
      el.innerHTML = sel.map(m => `
        <div class="selected-item">
          <span class="si-name" title="对外调用名：${escapeHtml(pid)}/${escapeHtml(m)}">${escapeHtml(pid)}/${escapeHtml(m)}</span>
          <i data-lucide="x" class="si-remove" title="移除" data-model="${escapeHtml(m)}"
            onclick="toggleModelSelection(${idx}, this.dataset.model, false)"></i>
        </div>`).join('');
      lucide.createIcons();
    }

    // 弹窗：展示该厂商全部模型（已选打勾），可搜索 / 分组 / 勾选
    function openModelModal(idx) {
      const p = currentConfig.providers[idx];
      const selectedSet = new Set(p.selected_models || []);
      const groupsHtml = buildModelGroupsHtml(idx, p.models || [], selectedSet);
      const total = (p.models || []).length;
      document.getElementById('modalRoot').innerHTML = `
        <div class="modal-overlay" onclick="if(event.target===this)closeModal()" onkeydown="handleModalKeydown(event)">
          <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modelModalTitle">
            <div class="modal-head">
              <span class="modal-title" id="modelModalTitle">${escapeHtml(p.name)} · 选择模型</span>
              <button type="button" class="modal-close-btn" onclick="closeModal()" aria-label="关闭选择模型弹窗"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body">
              <input type="text" class="input-text model-search" id="modelSearch_${idx}" placeholder="搜索模型..." oninput="filterModels(${idx})" />
              <div class="models-box" id="modelsBox_${idx}" style="max-height:none;border:none;padding:0;">
                ${groupsHtml || '<div class="empty-models">无可用模型</div>'}
              </div>
            </div>
            <div class="modal-foot">

    function handleModalKeydown(event) {
      if (event.key === 'Escape') {
        event.preventDefault();
        closeModal();
        return;
      }
      if (event.key !== 'Tab') return;
      const modal = event.currentTarget.querySelector('.modal');
      if (!modal) return;
      const focusable = Array.from(modal.querySelectorAll(
        'button:not([disabled]), input:not([disabled]), textarea:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])'
      )).filter(el => el.offsetParent !== null);
      if (!focusable.length) return;
      const first = focusable[0], last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }

    // 按模型家族分组（去区域/发行商前缀后取首个字母串），通用于所有厂商
    function modelGroupKey(m) {
      let s = String(m).toLowerCase();
      s = s.replace(/^publishers\/[^/]+\/models\//, '');
      const prefixes = ['us','eu','apac','global','anthropic','google','meta','mistral','cohere','ai21','amazon','deepseek','qwen','openai'];
      let parts = s.split('.');
      while (parts.length > 1 && prefixes.includes(parts[0])) parts.shift();
      s = parts.join('.');
      const mm = s.match(/^[a-z]+/);
      return mm ? mm[0] : 'other';
    }

      return Object.keys(groups).sort().map(g => {

      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(url);
        } else {
          const input = document.createElement('textarea');
          input.value = url;
          input.setAttribute('readonly', '');
          input.style.position = 'fixed';
          input.style.opacity = '0';
          document.body.appendChild(input);
          input.select();
          const copied = document.execCommand('copy');
          input.remove();
          if (!copied) throw new Error('浏览器拒绝访问剪贴板');
        }
        button.innerHTML = '<i data-lucide="check"></i><span>已复制</span>';
        lucide.createIcons();
        showToast(`已复制 ${url}`, 'success');
        setTimeout(() => {
          if (!button.isConnected) return;
          button.innerHTML = '<i data-lucide="copy"></i><span>复制</span>';

    function parseVertexServiceAccountJson(text) {
      let data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        throw new Error('文件不是有效的 JSON，请重新选择服务账号密钥文件');
      }
      if (!data || data.type !== 'service_account') {
        throw new Error('这不是 Google 服务账号密钥 JSON（type 应为 service_account）');
      }
      const required = [
        ['project_id', 'project_id'],
        ['client_email', 'client_email'],
        ['private_key', 'private_key'],
      ];
      const missing = required
        .filter(([field]) => typeof data[field] !== 'string' || !data[field].trim())
        .map(([, label]) => label);
      if (missing.length) {
        throw new Error(`JSON 缺少必要字段：${missing.join('、')}`);
      }
      return {
        project: data.project_id.trim(),
        client_email: data.client_email.trim(),
        private_key: data.private_key.trim(),
      };
    }

    async function importVertexServiceAccount(idx, input) {
      const file = input.files?.[0];
      if (!file) return;
      try {
        if (file.size > 1024 * 1024) {
          throw new Error('JSON 文件不能超过 1 MB');
        }
        const credentials = parseVertexServiceAccountJson(await file.text());
        const provider = currentConfig.providers[idx];
        if (!provider || provider.type !== 'vertex_ai') {
          throw new Error('当前厂商不是 Google Vertex AI');
        }
        provider.extra = { ...(provider.extra || {}), ...credentials };
        provider.models = [];
        provider.selected_models = [];
        provider.model_sources = [];
        renderDetail();
        lucide.createIcons();
        renderSidebar();
        showToast(`已从 ${file.name} 更换凭证，请重新拉取模型并确认 Location`, 'success');
      } catch (e) {
        showToast(`导入失败：${e.message}`, 'error');
      } finally {
        input.value = '';
      }
    }

    // 厂商 id 同时是模型名前缀（如 siliconflow/qwen-max），所以要收敛成
    // 只含 [a-z0-9_-] 的短标识；中文等无法转写的名称回退到时间戳。
    function slugifyProviderId(name) {
      let s = String(name).trim().toLowerCase()
        .replace(/[^a-z0-9]+/g, '_')
        .replace(/^_+|_+$/g, '')
        .slice(0, 32);
      if (!s) return 'custom_' + Date.now();
      if (/^\d/.test(s)) s = 'p_' + s;   // 避免纯数字开头的 id
      const taken = new Set((currentConfig.providers || []).map(p => p.id));
      if (!taken.has(s)) return s;
      for (let i = 2; i < 100; i++) {
        if (!taken.has(`${s}_${i}`)) return `${s}_${i}`;
      }
      return 'custom_' + Date.now();
    }

    function providerCatalogStatus(kind) {

        const count = (currentConfig.providers || []).filter(provider => provider.type === 'vertex_ai').length;

        pendingVertexCredentials = parseVertexServiceAccountJson(await file.text());
        const nameInput = document.getElementById('vertexProviderName');
        const idInput = document.getElementById('vertexProviderId');
        if (!vertexDraftNameEdited || !nameInput.value.trim()) nameInput.value = `Vertex AI · ${pendingVertexCredentials.project}`;
        if (!vertexDraftIdEdited || !idInput.value.trim()) idInput.value = slugifyProviderId(`vertex_${pendingVertexCredentials.project}`);
        const summary = document.getElementById('vertexDraftSummary');
        summary.classList.add('ready');
        summary.innerHTML = `<strong>${escapeHtml(pendingVertexCredentials.project)}</strong><br>${escapeHtml(pendingVertexCredentials.client_email)} · ${escapeHtml(file.name)}`;
        document.getElementById('vertexCredentialsError').textContent = '';

        updateVertexProviderPreview();

        pendingVertexCredentials = null;

    function setCustomProviderError(inputId, message) {
      const input = document.getElementById(inputId);
      const error = document.getElementById(`${inputId}Error`);
      if (!input || !error) return;
      input.classList.toggle('input-invalid', Boolean(message));
      input.setAttribute('aria-invalid', message ? 'true' : 'false');
      error.textContent = message;
    }

    function clearCustomProviderError(inputId) {
      setCustomProviderError(inputId, '');
    }

    function validateCustomProviderField(inputId) {
      const input = document.getElementById(inputId);
      if (!input) return false;
      const value = input.value.trim();
      let message = '';
      if (inputId === 'customProviderName' && !value) {
        message = '请输入厂商名称';
      } else if (inputId === 'customProviderId') {
        if (!value) message = '请输入模型前缀';
        else if (!/^[a-z0-9][a-z0-9_-]{0,31}$/.test(value)) message = '请使用 1–32 位小写字母、数字、下划线或连字符';
        else if ((currentConfig.providers || []).some(p => p.id === value)) message = '该模型前缀已存在，请换一个';
      } else if (inputId === 'customProviderBaseUrl') {
        if (!value) {
          message = '请输入 API Base URL';
        } else {
          try {
            const url = new URL(value);
            if (!['http:', 'https:'].includes(url.protocol)) message = '地址必须以 http:// 或 https:// 开头';
          } catch (e) {
            message = '请输入完整有效的 URL';
          }
        }
      }
      setCustomProviderError(inputId, message);
      return !message;
    }

    async function fetchModelsForProvider(idx) {
      const p = currentConfig.providers[idx];
      const btn = document.getElementById(`fetchBtn_${idx}`);
      btn.disabled = true;
      btn.innerHTML = `<span>拉取中...</span>`;
      try {
        const res = await fetch(`/api/providers/${p.id}/fetch_models`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(p)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || '拉取失败');
        const prevSel = new Set(p.selected_models || []);
        p.models = data.models;
        p.model_sources = data.sources || [];
        p.selected_models = data.models.filter(m => prevSel.has(m));  // 保留旧选择，不自动勾选新模型
        const failedSources = p.model_sources.filter(source => source.status !== 'ok');
        const suffix = failedSources.length
          ? `；${failedSources.map(source => source.name || source.id).join('、')} 未能读取`
          : '';
        showToast(`${p.name} 发现 ${data.models.length} 个候选模型${suffix}`, failedSources.length ? 'info' : 'success');
        renderSidebar();
        renderDetail();
        lucide.createIcons();
      } catch (e) {
        showToast(e.message, 'error');
        if (btn) btn.disabled = false;
      }
    }

    function updateTestModels() {
      const select = document.getElementById('testModelSelect');
      if (!select) return;
      select.innerHTML = '';
      const added = new Set();
      const models = [];
      (currentConfig?.providers || []).forEach(p => {
        if (!p.enabled) return;
        (p.selected_models || p.models || []).forEach(m => {
          const pub = `${p.id}/${m}`;
          if (!added.has(pub)) {
            added.add(pub);
            models.push(pub);
          }
        });
      });
      const mediaModel = /(image|imagen|veo|video|audio|tts|embedding)/i;
      models.sort((a, b) => Number(mediaModel.test(a)) - Number(mediaModel.test(b)) || a.localeCompare(b));
      models.forEach(model => {
        const opt = document.createElement('option');
        opt.value = model;
        opt.textContent = model;
        select.appendChild(opt);
      });
    }

    async function saveAndApply() {
      try {
        const res = await fetch('/api/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(currentConfig)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || '保存失败');
        showToast('配置已保存并重载！', 'success');
        setTimeout(checkHealth, 1500);
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    async function restartService() {
      const btn = document.getElementById('btnRestart');
      btn.disabled = true;
      showToast('正在重启后端网关...', 'info');
      try {
        const res = await fetch('/api/restart', { method: 'POST' });
        const data = await res.json();
        showToast(data.message || '已触发重启', 'success');
        setTimeout(checkHealth, 3000);
      } catch (e) {
        showToast('重启请求发送失败: ' + e.message, 'error');
      } finally {
        setTimeout(() => { btn.disabled = false; }, 3000);
      }
    }

    function extractResponsesText(data) {
      if (typeof data?.output_text === 'string') return data.output_text;
      for (const item of (data?.output || [])) {
        for (const content of (item?.content || [])) {
          if (typeof content?.text === 'string') return content.text;
        }
      }
      return '';
    }

    function formatApiTestResult(endpointKey, endpoint, res, data, elapsed) {
      const header = `[${endpoint.method} ${endpoint.path}] HTTP ${res.status} · ${elapsed}ms`;
      let summary = '';
      if (endpointKey === 'models' && Array.isArray(data?.data)) {
        const models = data.data.map(model => `${model.id}${model.owned_by ? `  (${model.owned_by})` : ''}`);
        summary = `获取到 ${models.length} 个模型\n${models.join('\n')}`;
      } else if (endpointKey === 'chat') {
        const reply = data?.choices?.[0]?.message?.content;
        if (reply) summary = `模型回复\n${reply}`;
      } else if (endpointKey === 'responses') {
        const reply = extractResponsesText(data);
        if (reply) summary = `模型回复\n${reply}`;
      } else if (endpointKey === 'health') {
        summary = data?.litellm_ready ? '网关与 LiteLLM 核心均已就绪' : '网关可访问，但 LiteLLM 核心未就绪';
      }
      const raw = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
      return `${header}${summary ? `\n\n${summary}` : ''}\n\n原始响应\n${raw}`;
    }

    async function runApiTest() {
      const endpointKey = activeApiEndpoint;
      const endpoint = API_ENDPOINTS[endpointKey];
      const btn = document.getElementById('btnRunTest');
      const resultBox = document.getElementById('testResult');
      if (!endpoint || !btn || !resultBox) return;

      const needsModel = endpointKey === 'chat' || endpointKey === 'responses';
      const model = needsModel ? document.getElementById('testModelSelect')?.value : '';
      const prompt = needsModel ? document.getElementById('testPrompt')?.value.trim() : '';
      if (needsModel && !model) { showToast('请先选择或启用一个模型', 'error'); return; }
      if (needsModel && !prompt) { showToast('请输入测试提示词', 'error'); return; }

      const originalButtonHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span>请求中...</span>';
      resultBox.textContent = '请求中...';
      const start = Date.now();
      try {
        const headers = endpoint.auth ? { 'Authorization': 'Bearer test' } : {};
        const options = { method: endpoint.method, headers };
        if (endpoint.method === 'POST') {
          headers['Content-Type'] = 'application/json';
          options.body = JSON.stringify(endpointKey === 'responses'
            ? { model, input: prompt, stream: false }
            : { model, messages: [{ role: 'user', content: prompt }], stream: false });
        }
        const res = await fetch(endpoint.path, options);
        const elapsed = Date.now() - start;
        const text = await res.text();
        let data;
        try { data = text ? JSON.parse(text) : {}; } catch (e) { data = text; }
        resultBox.textContent = formatApiTestResult(endpointKey, endpoint, res, data, elapsed);
        resultBox.style.color = res.ok ? '#cbd5e1' : '#fca5a5';
      } catch (e) {
        resultBox.textContent = `请求失败: ${e.message}`;
        resultBox.style.color = '#fca5a5';
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalButtonHtml;
        lucide.createIcons();
      }
    }

    function initLogs() {
      const box = document.getElementById('logsBox');
      if (!box) return;
      const evtSource = new EventSource('/api/logs/stream');
      evtSource.onmessage = (e) => {
        const target = document.getElementById('logsBox');
        if (!target) { evtSource.close(); return; }
        const line = document.createElement('div');
        line.className = 'log-line';
        if (e.data.includes('ERROR') || e.data.includes('Exception')) line.classList.add('log-err');
        else if (e.data.includes('WARNING')) line.classList.add('log-warn');
        line.textContent = e.data;
        target.appendChild(line);
        if (target.childNodes.length > 300) target.removeChild(target.firstChild);
        target.scrollTop = target.scrollHeight;
      };
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadProviders();
      checkHealth();
      setInterval(checkHealth, 5000);
    });
  </script>
</body>
